# Apache VirtualHost Configuration for jichangyusuan.cc

<VirtualHost *:80>
    ServerName jichangyusuan.cc
    ServerAlias www.jichangyusuan.cc
    Redirect permanent / https://jichangyusuan.cc/
</VirtualHost>

<VirtualHost *:443>
    ServerName jichangyusuan.cc
    ServerAlias www.jichangyusuan.cc

    DocumentRoot "/var/www/jichangyusuan.cc/current"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/jichangyusuan.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jichangyusuan.cc/privkey.pem

    <Directory "/var/www/jichangyusuan.cc/current">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/jichangyusuan_error.log
    CustomLog ${APACHE_LOG_DIR}/jichangyusuan_access.log combined
</VirtualHost>
